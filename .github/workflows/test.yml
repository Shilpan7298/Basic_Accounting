name: Tests

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install the PDF stack
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libcairo2 libgdk-pixbuf-2.0-0
      - run: pip install -e "./backend[dev]"
      - run: python -m pytest backend/tests -q
      - name: Migrations apply and reverse
        run: |
          cd backend
          DATABASE_URL="sqlite:///$RUNNER_TEMP/mig.db" python -m alembic upgrade head
          DATABASE_URL="sqlite:///$RUNNER_TEMP/mig.db" python -m alembic downgrade base

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
