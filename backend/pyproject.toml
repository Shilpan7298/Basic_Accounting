[project]
name = "urjapod-backend"
version = "0.1.0"
description = "Order and invoicing system for Urjapod Energy Private Limited"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "docxtpl>=0.17",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "pypdf>=4.2",
  "lxml>=5.2",
  "weasyprint>=62",
  "APScheduler>=3.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "reportlab>=4.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/documents/*/*", "extractors/prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
